name: hiicampus_habit_tracker
description: "HiiCampus Challenge App - Phase 2 habit tracker with Firestore, BLoC and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Functional programming (Either)
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^16.2.0

  # Code generation support
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Firebase
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ">=2.9.0 <2.15.2"
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

